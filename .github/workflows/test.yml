name: TradeLab Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest --junitxml=reports/api-junit.xml --alluredir=reports/allure-results
      - run: python scripts/reproduce_oversell.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-results-${{ matrix.python }}
          path: reports/
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ui.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/ui --browser chromium --tracing retain-on-failure --screenshot only-on-failure --junitxml=reports/ui-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            reports/
            test-results/
